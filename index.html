<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>yosi__bros Inventory</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header>
      <div>
        <p class="eyebrow">INVENTORY</p>
        <h1>yosi__bros</h1>
        <p class="subtitle">Rare Cigs stock tracker</p>
      </div>
      <button id="clearAll" class="danger ghost">Clear All</button>
    </header>

    <section class="stats">
      <div class="card"><span>Products</span><strong id="productCount">0</strong></div>
      <div class="card"><span>Total stock</span><strong id="totalStock">0</strong></div>
      <div class="card"><span>Low stock</span><strong id="lowStock">0</strong></div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>Add product</h2>
      </div>
      <form id="productForm">
        <input id="productName" placeholder="Product name" maxlength="80" required>
        <input id="quantity" type="number" min="0" value="0" required>
        <button type="submit">Add Product</button>
      </form>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>Rare Cigs</h2>
        <input id="search" class="search" placeholder="Search products...">
      </div>
      <div id="empty" class="empty">No products yet. Add your first product above.</div>
      <div id="productList"></div>
    </section>

    <footer>Data is stored locally in this browser using localStorage.</footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
